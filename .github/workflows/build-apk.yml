name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "www/**"
      - "app.js"
      - "widget-snapshot.js"
      - "index.html"
      - "styles.css"
      - "firebase-config.js"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          TOOLS="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$TOOLS" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$TOOLS" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets into Capacitor
        run: |
          npm run sync:www
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-hub-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: 채소가족 APK v${{ github.run_number }}
          body: |
            Android 설치 파일입니다.
            다운로드 후 파일 관리자에서 열어 설치하세요.
            (알 수 없는 출처 앱 설치 허용이 필요할 수 있습니다.)
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
